[workspace]
members = ["bin/rwa", "crates/cli", "crates/ondo"]
default-members = ["bin/rwa"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"
description = "CLI for trading tokenized stocks & ETFs (Ondo GM) on Solana via Jupiter"
repository = "https://github.com/outputlayer/rwa_cli"
keywords = ["solana", "cli", "trading", "rwa", "ondo"]
categories = ["command-line-utilities", "finance"]

[workspace.dependencies]
# Internal crates
rwa-cli = { path = "crates/cli" }
rwa-ondo = { path = "crates/ondo" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# Crypto (Solana signing)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
bs58 = "0.5"

# BIP39 / SLIP-10 (mnemonic import)
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"

# Time
chrono = "0.4"
chrono-tz = "0.10"

# Misc
dirs = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
