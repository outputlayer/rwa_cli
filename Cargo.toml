[workspace]
members = ["bin/rwa", "crates/cli", "crates/ondo"]
default-members = ["bin/rwa"]
resolver = "2"

[workspace.package]
version = "0.7.12"
edition = "2024"
license = "MIT"
rust-version = "1.91"
description = "CLI for trading tokenized stocks & ETFs (Ondo GM) on Solana via Jupiter"
repository = "https://github.com/outputlayer/rwa_cli"
keywords = ["solana", "cli", "trading", "rwa", "ondo"]
categories = ["command-line-utilities", "finance"]

[workspace.dependencies]
# Internal crates
rwa-cli = { path = "crates/cli" }
rwa-ondo = { path = "crates/ondo" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
eyre = "0.6"

# Crypto (Solana signing)
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
base64 = "0.22"
bs58 = "0.5"

# BIP39 / SLIP-10 (mnemonic import)
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"

# Time
chrono = "0.4"
chrono-tz = "0.10"

# Misc
dirs = "6"
hex = "0.4"
fs2 = "0.4"

# Self-update
self-replace = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Wallet encryption
age = "0.10"
rpassword = "7"
# keyring's optional dbus-secret-service backend lands in Cargo.lock but is
# never built (feature-gated off); the Linux backend is pure-Rust zbus via
# async-secret-service+async-io.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }

# Dev / test only
httpmock = "0.7"
proptest = "1"
zeroize = { version = "1", features = ["serde"] }
criterion = "0.5"
serial_test = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
