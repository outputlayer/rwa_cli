[package]
name = "rwa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rwa-ondo.workspace = true
clap.workspace = true
tokio.workspace = true
eyre.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
fs2.workspace = true
dirs.workspace = true
rpassword.workspace = true
keyring.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
self-replace.workspace = true
flate2.workspace = true
tar.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
httpmock.workspace = true
serial_test.workspace = true
# rt-multi-thread: `view::tests::view_dictionaries_do_not_collide` (#[ignore])
# builds its own `tokio::runtime::Runtime::new()`, which needs it. Previously
# this compiled only because `cargo test --workspace` unifies features across
# every crate being tested and rwa-ondo's dev-deps happen to request it too —
# `cargo test -p rwa-cli --ignored` alone would not have built.
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
zip.workspace = true
