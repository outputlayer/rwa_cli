name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --all-targets

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Unit tests (ondo)
        run: cargo test -p rwa-ondo --lib

      - name: Unit tests (cli)
        run: cargo test -p rwa-cli --lib

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # httpmock uses a local mock server — no real network required
      - name: Integration tests (ondo)
        run: cargo test -p rwa-ondo --test rpc_portfolio

      # Spawns the real `rwa` binary against mock servers; locks the --json contract
      - name: CLI contract tests (rwa)
        run: cargo test -p rwa --test cli_contract

      # Drift guards: every command + every error_kind is documented (README/CLAUDE/llms.txt)
      - name: Docs drift guard (rwa-cli)
        run: cargo test -p rwa-cli --test docs_sync

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, test, integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release
        run: cargo build --release

      - name: Binary size
        run: ls -lh target/release/rwa | awk '{print "Binary size:", $5}'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Advisory scan for a wallet-holding binary: `--deny warnings` fails on
      # ANY RUSTSEC advisory (vulnerability, unsound, or unmaintained) in the
      # tree. The two ignores are UNMAINTAINED crates with NO runtime presence
      # in the shipped binary (verified via `cargo tree -i`):
      #   RUSTSEC-2025-0052  async-std        ← httpmock (dev-dependency, tests only)
      #   RUSTSEC-2024-0370  proc-macro-error ← i18n-embed-fl (age's build-time proc-macro)
      # Independent of the build/test jobs (which `make ci` mirrors) — this one
      # needs the advisory DB and can go red on a newly-published advisory with
      # no code change, so it is deliberately its own job, not part of `make ci`.
      - name: cargo audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0052 --ignore RUSTSEC-2024-0370
