name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --all-targets

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests (ondo)
        run: cargo test -p rwa-ondo --lib

      - name: Unit tests (cli)
        run: cargo test -p rwa-cli --lib

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # httpmock uses a local mock server — no real network required
      - name: Integration tests (ondo)
        run: cargo test -p rwa-ondo --test rpc_portfolio

      # Spawns the real `rwa` binary against mock servers; locks the --json contract
      - name: CLI contract tests (rwa)
        run: cargo test -p rwa --test cli_contract

      # Drift guards: every command + every error_kind is documented (README/CLAUDE/llms.txt)
      - name: Docs drift guard (rwa-cli)
        run: cargo test -p rwa-cli --test docs_sync

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, test, integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Binary size
        run: ls -lh target/release/rwa | awk '{print "Binary size:", $5}'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Advisory scan for a wallet-holding binary: fails on any RUSTSEC
      # vulnerability in the dependency tree. Independent of the build/test
      # jobs (which `make ci` mirrors) — this one needs the advisory DB and
      # can go red on a newly-published advisory with no code change, so it is
      # deliberately its own job, not part of the local `make ci` gate.
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
