name: Update token list

# Refresh the hardcoded Ondo GM token list (crates/ondo/src/token_list.rs) from
# the live Ondo asset universe + Jupiter mint resolution. Mints stay hardcoded;
# this only automates regenerating them. A human reviews and merges the PR —
# that review is the safety gate that catches any unexpected addition (e.g. a
# new non-equity Ondo product, or a symbol that fails mint-authority checks).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate & open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate token_list.rs
        run: python3 scripts/update-token-list.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- crates/ondo/src/token_list.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Token list already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Validate the regenerated list before proposing it: integrity tests
      # (count, sort, uniqueness, base58→32 bytes, canary mints) must pass.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.diff.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.changed == 'true'

      - name: Validate token list
        if: steps.diff.outputs.changed == 'true'
        run: cargo test -p rwa-ondo token_list

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-token-list
          commit-message: "chore(tokens): refresh GM token list from Ondo + Jupiter"
          title: "chore(tokens): refresh GM token list"
          body: |
            Automated refresh of `crates/ondo/src/token_list.rs`.

            Source of truth:
            - Symbols: Ondo `/api/v2/assets` (tokenized equities/ETFs, suffix `on`)
            - Mints: Jupiter token search, verified against Ondo's mint authority

            Gates that passed before this PR was opened (in `update-token-list.py`):
            - **Form**: unique symbols/mints, base58 → 32 bytes, `on` suffix
            - **On-chain**: every mint exists on Solana as a Token-2022 mint with
              Ondo's issuer authority (`getMultipleAccounts`)
            - **Tradability**: every symbol is in Ondo session-limits and tradable
              in ≥1 session (the CLI's own tradability source — not a flaky live
              Jupiter RFQ quote)
            - **Integrity tests**: `cargo test -p rwa-ondo token_list`

            **Review the diff before merging** — confirm any added/removed symbols
            are expected. The checks exclude look-alike tokens and non-Solana junk,
            but a human gate catches new non-equity Ondo products and surprises.
          labels: automated, tokens
